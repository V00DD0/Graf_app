name: Build and verify Karta packages
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the editor in Edge
        shell: pwsh
        run: |
          python build.py
          git diff --exit-code -- Karta-2.1.html
          python -m pip install playwright
          $env:CHROMIUM = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          foreach ($test in Get-ChildItem test-*.py) {
            python $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and exercise the per-user installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis --yes --no-progress }
          & $nsis packaging/windows/Karta.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Join-Path $env:RUNNER_TEMP 'Карта связей'
          $setup = Start-Process -FilePath packaging/windows/Karta-2.5.0-Windows.exe -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exit code: $($setup.ExitCode)" }
          foreach ($name in 'Karta.exe','Karta-2.1.html') {
            if ((Get-FileHash (Join-Path $install $name)).Hash -ne (Get-FileHash $name).Hash) { throw "Unexpected installed file: $name" }
          }
          Compress-Archive Karta.exe,Karta-2.1.html Karta-2.5.0-Windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Karta-2.5.0-Windows
          if-no-files-found: error
          path: |
            packaging/windows/Karta-2.5.0-Windows.exe
            Karta-2.5.0-Windows-portable.zip
      - name: Verify the launcher with a different working directory
        shell: pwsh
        run: ./check-launcher.ps1
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify Linux packages
        run: |
          python build.py
          git diff --exit-code -- Karta-2.1.html
          sudo apt-get update
          sudo apt-get install -y rpm cpio desktop-file-utils
          export APPIMAGETOOL="$RUNNER_TEMP/appimagetool"
          curl --fail --location --silent --show-error https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$APPIMAGETOOL"
          printf '%s  %s\n' ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 "$APPIMAGETOOL" | sha256sum -c -
          chmod 755 "$APPIMAGETOOL"
          bash packaging/linux/build.sh
          bash packaging/linux/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Karta-2.5.0-Linux
          path: dist/
          if-no-files-found: error
      - name: Run browser and load tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          for script in test-*.py benchmark.py; do python "$script"; done
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 build.py && git diff --exit-code -- Karta-2.1.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash android/build-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Karta-2.5.0-Android-test
          path: Karta-2.5.0-preview.apk
          if-no-files-found: error
      - name: Enable hardware acceleration for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify upgrades, backups and call statistics on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/test-device.sh
