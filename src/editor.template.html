async function saveSnapshot(snapshot,key=vaultKey,salt=vaultSalt){
 let record=snapshot;
 if(key){
  const iv=crypto.getRandomValues(new Uint8Array(12));

 }
 await new Promise((resolve,reject)=>{

  };

async function internalKey(password,salt){
 const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:220000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
function passwordError(value){
 const missing=[];
 if(Array.from(value).length<8)missing.push("не менее 8 символов");
 if(!/\p{Ll}/u.test(value))missing.push("строчная буква");
 if(!/\p{Lu}/u.test(value))missing.push("заглавная буква");
 if(!/\p{Nd}/u.test(value))missing.push("цифра");
 if(!/[\p{P}\p{S}]/u.test(value))missing.push("спецсимвол");
 return missing.length?"Требуется: "+missing.join(", ")+".":"";
}
function askSecret(title,verify=false){

  const dlg=document.createElement("dialog");
  dlg.setAttribute("aria-labelledby","secret-title");
  dlg.innerHTML='<form method="dialog"><h3 id="secret-title"></h3>'+
   (verify?'<p id="secret-rules">Минимум 8 символов, включая заглавную и строчную буквы, цифру и спецсимвол (например, ! или #).</p>':'')+
   '<label>Пароль <input name="secret" type="password" required autofocus></label>'+
   (verify?'<label>Повторите пароль <input name="confirmation" type="password" required autocomplete="new-password"></label><label><input name="visible" type="checkbox"> Показать оба поля пароля</label>':'')+
   '<p role="alert"></p><button value="ok">Продолжить</button> <button value="cancel" formnovalidate>Отмена</button></form>';
  dlg.querySelector("h3").textContent=title;
  const form=dlg.querySelector("form"),{secret,confirmation,visible}=form.elements;
  const alert=dlg.querySelector('[role="alert"]');
  secret.autocomplete=verify?"new-password":"current-password";
  if(verify){
   secret.setAttribute("aria-describedby","secret-rules");
   visible.onchange=()=>{secret.type=confirmation.type=visible.checked?"text":"password";};
   form.oninput=()=>{alert.textContent="";};
   form.onsubmit=e=>{
    if(e.submitter?.value==="cancel")return;
    const error=passwordError(secret.value);
    if(error||secret.value!==confirmation.value){
     e.preventDefault();alert.textContent=error||"Пароли не совпадают.";
     (error?secret:confirmation).focus();
    }
   };
  }
  dlg.onclose=()=>{
   const result=dlg.returnValue==="ok"?secret.value:null;
   form.reset();dlg.remove();resolve(result);
  };
  document.body.append(dlg);dlg.showModal();
 });
}

function findPath(a,b,familyOnly=false){

 const graph=adjacency(familyOnly),seen=new Set([a]),q=[a],prev=new Map();
 for(let i=0;i<q.length;i++){
  const cur=q[i];
  for(const item of graph.get(cur)||[]){
   if(seen.has(item.to))continue;
   seen.add(item.to);prev.set(item.to,{from:cur,...item});
   if(item.to===b){
    let at=b,res=[];
    while(at!==a){const edge=prev.get(at);res.push(edge);at=edge.from;}
    return res.reverse();
   }
   q.push(item.to);
  }

}

function pathFor(a,b,e){

  const requested=clamp(e.bend,40,-400,400);
  const bend=Math.sign(requested)*Math.min(Math.abs(requested),Math.hypot(x2-x1,y2-y1)/2);
  return `M ${x1} ${y1} Q ${(x1+x2)/2-uy*bend} ${(y1+y2)/2+ux*bend} ${x2} ${y2}`;
 }

function updateSetting(el){
 const path=el.dataset.setting;if(!path)return;
 if(path==="rings.individual"||path==="rings.count"||path.startsWith("radius.")){changeRingSetting(el);return;}
 let val=el.type==="checkbox"?el.checked:el.value;
 remember("Изменены настройки");
 if(path.startsWith("ringName."))data.settings.rings.names[Number(path.split(".")[1])]=fmt(val).trim().slice(0,80);
 else if(path.startsWith("ringStyle.")){
  const [,index,key]=path.split("."),rings=data.settings.rings,line=ringLine(rings,index);
  const value=key==="dash"?(val==="dashed"?"8 5":""):key==="color"?val:el.valueAsNumber;
  rings.styles[index]={...rings.styles[index],...validateRingStyle({[key]:value},line)};
 }
 else if(path==="rings.labelColor")data.settings.rings.labelColor=validColor(val,"#6b503c");
 else if(path==="rings.labelSize")data.settings.rings.labelSize=clamp(val,14,8,40);
 else if(path==="timeline")data.filters.timeline=!!val;
 else if(path==="sectors.count"){
  const count=clamp(val,5,2,24),se=data.settings.sectors;
  se.weights=Array.from({length:count},(_,i)=>se.weights[i]||1);
  se.labels=Array.from({length:count},(_,i)=>se.labels[i]||`Сектор ${i+1}`);
 }else if(path.startsWith("sectorLabel."))data.settings.sectors.labels[Number(path.split(".")[1])]=fmt(val).slice(0,80);
 else if(path.startsWith("sectorWeight."))data.settings.sectors.weights[Number(path.split(".")[1])]=clamp(val,1,.1,30);
 else{
  const segments=path.split(".");
  const target=segments.length===1?data.settings:data.settings[segments[0]];
  const key=segments.at(-1),cur=target[key];
  target[key]=typeof cur==="boolean"?!!val:
   typeof cur==="number"?clamp(val,cur,key==="alpha"?0:key==="step"?50:.2,key==="alpha"?1:2000):
   key==="color"||key==="bg"?validColor(val):fmt(val).replace(/[^0-9, .]/g,"").slice(0,30);
 }
 preview=null;previewInfo=null;finish();renderRight();
}

const b64=bytes=>{
 let str="";for(let i=0;i<bytes.length;i+=8192)str+=String.fromCharCode(...bytes.subarray(i,i+8192));
 return btoa(str);
};
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
const maxBackupBytes=128*1024*1024;
async function cryptKey(password,salt,mode){
 const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:220000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,[mode]);
}
async function encryptedExport(){
 if(!globalThis.crypto?.subtle){notify("Web Crypto недоступен в этом окружении");return;}
 const pass=await askSecret("Пароль резервной копии",true);
 if(pass===null)return;
 try{
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await cryptKey(pass,salt,"encrypt");
  const plain=new TextEncoder().encode(JSON.stringify(data));
  const bytes=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,plain));
  const text=JSON.stringify({encrypted:true,version:1,algorithm:"AES-256-GCM",iterations:220000,salt:b64(salt),iv:b64(iv),data:b64(bytes)});
  if(text.length>maxBackupBytes)throw Error("Размер резервной копии превышает 128 МБ");
  download("karta-svyazey-encrypted.json",text,"application/json");
  if(!window.KartaFiles)notify("Запрошена загрузка зашифрованной копии");
 }catch(e){notify("Ошибка шифрования: "+e.message);}
}

async function importData(file,target=mapId){
 if(file.size>maxBackupBytes){notify("Импорт поддерживает файлы до 128 МБ");return;}
 try{
  let raw=JSON.parse(await file.text());
  if(raw?.encrypted===true){
   if(!crypto?.subtle)throw Error("Web Crypto недоступен");
   if(raw.version!==1||raw.algorithm!=="AES-256-GCM"||raw.iterations!==220000||
      ![raw.salt,raw.iv,raw.data].every(value=>typeof value==="string"))throw Error("Неизвестный формат шифрования");
   const salt=unb64(raw.salt),iv=unb64(raw.iv),cipher=unb64(raw.data);
   if(salt.length!==16||iv.length!==12||cipher.length<16)throw Error("Повреждена резервная копия");
   const password=await askSecret("Расшифровать резервную копию");
   if(password===null)return;
   const key=await cryptKey(password,salt,"decrypt");
   let bytes;
   try{bytes=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,cipher);}
   catch{throw Error("Пароль неверен или резервная копия повреждена");}
   raw=JSON.parse(new TextDecoder().decode(bytes));
  }
  if(target!==mapId||switching||editingBase)throw Error("Завершите редактирование и повторите импорт в нужной карте");
  const next=validate(raw);
  if(data.people.length&&!confirm("Заменить текущий граф?"))return;
  root.inert=true;
  clearTimeout(pendingSave);
  try{await enqueueSave(JSON.stringify(next));dirty=false;}finally{root.inert=false;}
  remember("Импорт графа");
  data=next;updateViewIndicator();preview=null;route=[];closeSide();closeRight();draw();
  notify(`Загружено ${data.people.length} людей`);
 }catch(e){if(dirty)persist();notify("Импорт не выполнен: "+e.message);}
}
function mergeCandidates(){

 for(const n of data.people){
  const name=[n.surname,n.name,n.middle].join(" ").toLowerCase().replace(/\s+/g," ").trim();
  if(!name||name==="новый человек")continue;
  const key=name+"|"+(n.birth||"");
  if(map.has(key))pairs.push([map.get(key),n]);else map.set(key,n);
 }
 return pairs;
}

 data.links.forEach(l=>{if(l.a===b.id)l.a=a.id;if(l.b===b.id)l.b=a.id;});

   delete data.overrides[key];
  }
 }
 data.people=data.people.filter(n=>n.id!==b.id);

}

 ${only?`<p class="muted">Определение: ${h(kinLabel(a,b).label)}. Кровная степень: ${bloodDegree(a,b)??"не определена"}.</p>`:""}`;
}

root.addEventListener("click",ev=>{
 const attachment=ev.target.closest("a[download]");
 if(attachment&&window.KartaFiles&&attachment.href.startsWith("data:")){
  ev.preventDefault();const [header,bytes]=attachment.href.split(",");
  window.KartaFiles.save(attachment.download,header.slice(5).split(";")[0],bytes,true);return;
 }
 const preset=ev.target.closest("[data-palette]");
 if(preset){const {base,accent}=interfacePalettes[Number(preset.dataset.palette)];saveInterfaceTheme({base,accent});return;}
 const tab=ev.target.closest("[data-map]");if(tab){switchMap(tab.dataset.map);return;}
 const btn=ev.target.closest("[data-act]");
 if(btn&&actions[btn.dataset.act]){actions[btn.dataset.act]();return;}
 const menu=ev.target.closest("[data-menu]");
 if(menu){
  $("kv2-menu").hidden=true;
  const p=menuPoint;
  if(menu.dataset.menu==="new")newPerson(p);
  if(menu.dataset.menu==="label")newLabel(p);
  if(menu.dataset.menu==="openperson")openSide("person",menu.dataset.id);
  if(menu.dataset.menu==="openlink")openSide("link",menu.dataset.id);
  if(menu.dataset.menu==="openlabel")openSide("label",menu.dataset.id);
  return;
 }
 const go=ev.target.closest("[data-go]");
 if(go){searchReturn=pane==="directory";if(searchReturn)closeRight();openSide("person",go.dataset.go);if(searchReturn)side.querySelector("button")?.focus();return;}
 const edit=ev.target.closest("[data-editlink]");
 if(edit){openSide("link",edit.dataset.editlink);return;}
 for(const [dataset,kind,key] of [["removeLink","link","links"],["removeContact","contact","contacts"],["removeDoc","doc","docs"],["removeExtra","extra","extra"],["removeStatus","status","maritalEvents"]]){
  const el=ev.target.closest(`[data-${kind==="link"?"remove-link":kind==="contact"?"remove-contact":kind==="doc"?"remove-doc":kind==="extra"?"remove-extra":"remove-status"}]`);
  if(!el)continue;
  const value=el.dataset[dataset];
  if(kind==="link"){
   if(!confirm("Удалить семейную связь?"))return;
   remember("Удалена связь");data.links=data.links.filter(l=>l.id!==value);
  }else{
   const n=get(selected?.id);if(!n)return;
   remember("Удалена запись");n[key]=n[key].filter(x=>x.id!==value);
  }
  finish(true);return;
 }
});
let menuPoint={x:0,y:0};
function menu(clientX,clientY,type,idValue){
 const w=$("kv2-main").getBoundingClientRect(),el=$("kv2-menu");
 menuPoint=world(clientX,clientY);
 el.style.left=Math.max(0,Math.min(w.width-180,clientX-w.left))+"px";
 el.style.top=Math.max(0,Math.min(w.height-130,clientY-w.top))+"px";
 const items=type==="person"?[["openperson","Открыть карточку"]]:
  type==="link"?[["openlink","Редактировать связь"]]:
  type==="label"?[["openlabel","Редактировать подпись"]]:
  [["new","＋ Создать человека"],["label","T Добавить подпись"]];
 el.innerHTML=items.map(([act,title])=>`<button data-menu="${act}" data-id="${h(idValue||"")}">${title}</button>`).join("");
 el.hidden=false;
}

 ev.preventDefault();

 if(e.matches("[data-person-field],[data-link-field],[data-label-field],[data-extra]"))processField(e);

 const e=ev.target;
 if(e.dataset.interface){const key=e.dataset.interface;saveInterfaceTheme({[key]:key==="motion"?e.checked:e.value});return;}
 if(e.id==="call-csv"){importCounts(e.files?.[0]);e.value="";return;}

 if(e.dataset.filter)updateFilter(e);

 const file=ev.target.files?.[0];ev.target.value="";if(file)await importData(file);
});
$("kv2-photo").addEventListener("change",async ev=>{
 const file=ev.target.files?.[0];ev.target.value="";
 const personId=selected?.id,session=editingBase,draftPerson=get(personId);
 if(!file||!personId)return;
 if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>7*1024*1024){notify("Фотография: JPEG/PNG/WebP до 7 МБ");return;}
 let url;
 try{
  url=URL.createObjectURL(file);
  const im=new Image();
  await new Promise((ok,fail)=>{im.onload=ok;im.onerror=fail;im.src=url;});
  const scale=Math.min(1,600/Math.max(im.width,im.height));
  const canvas=document.createElement("canvas");
  canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);
  canvas.getContext("2d").drawImage(im,0,0,canvas.width,canvas.height);
  const n=get(personId);
  if(editingBase===session&&session&&n===draftPerson&&n){remember("Изменена фотография");n.photo=canvas.toDataURL("image/jpeg",.7);finish(selected?.id===personId);}
 }catch(e){notify("Не удалось прочитать фотографию");}
 finally{if(url)URL.revokeObjectURL(url);}
});
$("kv2-document").addEventListener("change",async ev=>{
 const file=ev.target.files?.[0];ev.target.value="";
 const personId=selected?.id,n=get(personId),session=editingBase;
 if(!file||!n)return;
 if(file.size>8*1024*1024||!["application/pdf","text/plain","image/png","image/jpeg"].includes(file.type)){
  notify("Допустимы PDF/TXT/PNG/JPEG до 8 МБ");return;
 }
 if(JSON.stringify(data).length+file.size*1.34>64000000){notify("Лимит графа с вложениями — 64 МБ");return;}
 if(n.docs.length>=15){notify("Лимит: 15 вложений на человека");return;}
 try{
  const content=await new Promise((ok,fail)=>{
   const reader=new FileReader();reader.onload=()=>ok(reader.result);reader.onerror=fail;reader.readAsDataURL(file);
  });
  if(!session||editingBase!==session||n!==get(personId))return;
  if(!validFileData(content)){notify("Недопустимый формат вложения");return;}
  remember("Добавлен документ");n.docs.push({id:id(),name:file.name.slice(0,140),data:content});finish(selected?.id===personId);
 }catch(e){notify("Ошибка чтения файла");}
});
svg.addEventListener("pointerdown",ev=>{
 if(ev.button!==0)return;
 $("kv2-menu").hidden=true;
 pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
 try{svg.setPointerCapture(ev.pointerId);}catch(e){}
 if(pointers.size>=2){
  clearTimeout(longTimer);
  const a=[...pointers.values()],center={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
  pinch={distance:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),k:data.view.k,point:world(center.x,center.y)};
  pointer=null;return;
 }
 const node=ev.target.closest("[data-person]"),label=ev.target.closest("[data-label]"),edge=ev.target.closest("[data-edge]");
 const kind=node?"person":label?"label":edge?"link":"pan";
 const targetId=node?.dataset.person||label?.dataset.label||edge?.dataset.edge;
 pointer={kind,id:targetId,x:ev.clientX,y:ev.clientY,px:ev.clientX,py:ev.clientY,moved:false,recorded:false};
 if(ev.pointerType==="touch")longTimer=setTimeout(()=>{
  if(pointer&&!pointer.moved){
   menu(ev.clientX,ev.clientY,kind,targetId);
   pointer=null;
  }
 },650);
});
svg.addEventListener("pointermove",ev=>{
 if(!pointers.has(ev.pointerId))return;
 pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
 if(pointers.size>=2&&pinch){
  const a=[...pointers.values()],mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
  const dist=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y);
  const k=clamp(pinch.k*dist/Math.max(1,pinch.distance),1,.12,4),r=rect();
  data.view.k=k;data.view.x=mid.x-r.left-r.width/2-pinch.point.x*k;
  data.view.y=mid.y-r.top-r.height/2-pinch.point.y*k;
  draw();return;
 }
 if(!pointer)return;
 const dx=ev.clientX-pointer.px,dy=ev.clientY-pointer.py;
 if(Math.hypot(ev.clientX-pointer.x,ev.clientY-pointer.y)>5){pointer.moved=true;clearTimeout(longTimer);}
 if(!pointer.moved)return;
 if(pointer.kind==="pan"){data.view.x+=dx;data.view.y+=dy;}
 else if(!preview&&(pointer.kind==="person"||pointer.kind==="label")){
  const target=pointer.kind==="person"?get(pointer.id):getLabel(pointer.id);
  if(target){
   if(!pointer.recorded){remember("Перемещение элемента",moveState(pointer.kind,target));pointer.recorded=true;}
   target.x+=dx/data.view.k;target.y+=dy/data.view.k;
  }
 }
 pointer.px=ev.clientX;pointer.py=ev.clientY;
 if(!pendingFrame)pendingFrame=requestAnimationFrame(()=>{
  pendingFrame=0;
  if(!pointer||pointer.kind!=="person"||preview){draw();return;}
  if(!pointer.visual){
   const byId=new Map(data.people.map(person=>[person.id,person]));
   const rendered=new Map([...svg.querySelectorAll("[data-edge]")].map(el=>[el.dataset.edge,el]));
   const captions=new Map([...svg.querySelectorAll("[data-caption]")].map(el=>[el.dataset.caption,el]));
   pointer.visual={
    person:byId.get(pointer.id),node:svg.querySelector(".node[data-person="+CSS.escape(pointer.id)+"]"),
    edges:data.links.filter(e=>(e.a===pointer.id||e.b===pointer.id)&&rendered.has(e.id))
     .map(e=>({e,from:byId.get(e.a),to:byId.get(e.b),paths:rendered.get(e.id).children,caption:captions.get(e.id)}))
   };
  }
  const {person,node,edges}=pointer.visual;
  node?.setAttribute("transform",`translate(${person.x} ${person.y})`);
  for(const {e,from,to,paths,caption} of edges){
   const path=pathFor(from,to,e);
   for(const el of paths)el.setAttribute("d",path);
   if(caption){caption.setAttribute("x",(from.x+to.x)/2);caption.setAttribute("y",(from.y+to.y)/2-12);}
  }
 });
});
function pointerEnd(ev){
 clearTimeout(longTimer);pointers.delete(ev.pointerId);
 if(pointers.size<2)pinch=null;
 if(!pointer){persist();return;}
 const p=pointer;pointer=null;
 if(p.moved){draw();persist();return;}
 if(p.kind==="person"){
  if(mode==="link"){
   if(anchor&&anchor!==p.id){
    addLink(anchor,p.id);
    mode="select";anchor=null;$("kv2-link-btn").classList.remove("active");
   }else{anchor=p.id;notify("Нажмите на второго человека");}
  }else openSide("person",p.id);
 }else if(p.kind==="link")openSide("link",p.id);
 else if(p.kind==="label")openSide("label",p.id);
}
svg.addEventListener("pointerup",pointerEnd);
svg.addEventListener("pointercancel",ev=>{pointers.delete(ev.pointerId);pointer=null;pinch=null;clearTimeout(longTimer);});

},{passive:false});
svg.addEventListener("dblclick",ev=>{

 if(ev.key==="Escape"){mode="select";anchor=null;preview=null;previewInfo=null;route=[];$("kv2-menu").hidden=true;$("kv2-link-btn").classList.remove("active");draw();}
 if(!ev.target.closest("input,textarea,select")&&(ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="z"){ev.preventDefault();rollback(ev.shiftKey?"redo":"undo");}
 if((ev.key==="Delete"||ev.key==="Backspace")&&selected&&!["INPUT","TEXTAREA","SELECT"].includes(ev.target.tagName)){ev.preventDefault();deleteSelected();}
});

const grip=side.querySelector(".head");
 let dragPanel=null;
 grip.addEventListener("pointerdown",e=>{
  if(!matchMedia("(min-width:721px)").matches||e.target.closest("button"))return;
  const box=side.getBoundingClientRect();
  dragPanel={x:e.clientX-box.left,y:e.clientY-box.top};

  if(!dragPanel)return;

 });

 matchMedia("(max-width:720px)").addEventListener("change",()=>{side.removeAttribute("style");root.classList.remove("detached");});
 if(globalThis.ResizeObserver)new ResizeObserver(()=>{if(!side.hidden)root.style.setProperty("--side-width",side.offsetWidth+"px");}).observe(side);
 loadStore();
})();
