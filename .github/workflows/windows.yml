name: Windows launcher and browser
on:
  push:
    branches: [qa/windows-launcher-2.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run the shipped EXE with a different working directory
        shell: pwsh
        run: ./check-launcher.ps1
      - uses: actions/setup-python@v5
        if: success() || failure()
        with:
          python-version: '3.12'
      - name: Test the unmodified HTML in Edge
        if: success() || failure()
        shell: pwsh
        run: |
          python -m pip install playwright
          $env:CHROMIUM = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          python test-browser.py
